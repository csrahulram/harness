<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guard viewer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <span class="mark"></span>
      <h1>Guard viewer</h1>
      <span class="verdict" id="verdict"></span>
      <span class="totals" id="totals"></span>
      <button class="small" id="scan">Scan</button>
    </header>

    <main>
      <textarea
        id="text"
        spellcheck="false"
        placeholder="Paste or type text here, then press Scan. It is split into overlapping chunks and every chunk is scored by the guard."
      ></textarea>
      <section class="chart">
        <canvas id="canvas"></canvas>
        <p class="detail" id="detail">hover a bar</p>
      </section>
    </main>

    <footer class="legend">
      <span class="item"><span class="swatch red"></span>0 &mdash; reads as an injection</span>
      <span class="item"><span class="swatch amber"></span>uncertain</span>
      <span class="item"><span class="swatch green"></span>1 &mdash; reads as safe</span>
      <span class="item">bar height is the score, the line is milliseconds</span>
    </footer>
  </body>
</html>
